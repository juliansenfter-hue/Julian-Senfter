<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Autobahn Racer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0a0f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    touch-action: none;
  }

  #topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 700px;
    padding: 10px 20px;
    flex-shrink: 0;
  }
  .stat {
    text-align: center;
  }
  .stat-label {
    font-size: 11px;
    letter-spacing: 3px;
    color: #666;
    text-transform: uppercase;
  }
  .stat-value {
    font-size: 28px;
    font-weight: bold;
    color: #ffc800;
    text-shadow: 0 0 14px rgba(255,200,0,0.5);
    line-height: 1.1;
  }
  .stat-value.blue { color: #00e5ff; text-shadow: 0 0 14px rgba(0,229,255,0.4); }

  #speed-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  #speed-label { font-size: 13px; color: #aaa; min-width: 90px; text-align: center; }
  #speed-bar-bg {
    width: 120px; height: 6px;
    background: #222;
    border-radius: 100px;
    overflow: hidden;
  }
  #speed-bar {
    height: 100%;
    width: 5%;
    background: linear-gradient(90deg, #00e5ff, #ffc800, #ff4444);
    border-radius: 100px;
    transition: width 0.3s;
  }

  canvas {
    display: block;
    max-width: 100%;
    border: 2px solid #222;
    box-shadow: 0 0 60px rgba(255,200,0,0.12), 0 0 120px rgba(255,200,0,0.04);
    border-radius: 6px;
    flex-shrink: 0;
  }

  #touch-hint {
    margin-top: 10px;
    font-size: 13px;
    color: #444;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div id="topbar">
  <div class="stat">
    <div class="stat-label">Score</div>
    <div class="stat-value" id="ui-score">0</div>
  </div>
  <div id="speed-wrap">
    <div id="speed-label">Langsam</div>
    <div id="speed-bar-bg"><div id="speed-bar"></div></div>
  </div>
  <div class="stat">
    <div class="stat-label">Highscore</div>
    <div class="stat-value blue" id="ui-high">0</div>
  </div>
</div>

<canvas id="c"></canvas>
<div id="touch-hint">Tippe links / rechts &nbsp;|&nbsp; A / D</div>

<script>
// ── Canvas sizing: fill available space ──
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  const maxW = Math.min(window.innerWidth, 700);
  const maxH = window.innerHeight - 100;
  const aspect = 7 / 10;
  let w = Math.min(maxW, maxH * aspect);
  let h = w / aspect;
  canvas.style.width  = w + 'px';
  canvas.style.height = h + 'px';
  // Internal resolution stays fixed for crisp rendering on retina
}
resize();
window.addEventListener('resize', resize);

// Fixed internal resolution
const W = 500, H = 720;
canvas.width  = W;
canvas.height = H;

// ── Road layout ──
const LANES = 4;
const ROAD_L = 28, ROAD_R = W - 28;
const ROAD_W = ROAD_R - ROAD_L;
const LANE_W = ROAD_W / LANES;
const SHOULDER = 16;

// ── Car sizes ──
const CAR_W = 50, CAR_H = 86;

// ── Persistence ──
let highScore = parseInt(localStorage.getItem('hs_autobahn') || '0');
document.getElementById('ui-high').textContent = dispScore(highScore);

// ── State ──
let state = 'start';
let score = 0, frame = 0, speed = 4;
let roadY = 0;
const DASH_H = 64, DASH_GAP = 42, DASH_P = DASH_H + DASH_GAP;
let enemies = [], spawnCD = 0;
let raf;

const player = { lane: 1, x: laneX(1), y: H - CAR_H - 30, moving: false };

function laneX(l) { return ROAD_L + l * LANE_W + (LANE_W - CAR_W) / 2; }
function dispScore(s) { return Math.floor(s / 4); }

// ── Colors ──
const PALETTE = [
  { body:'#e74c3c', roof:'#c0392b', win:'#aed6f1' },
  { body:'#3498db', roof:'#2980b9', win:'#aed6f1' },
  { body:'#2ecc71', roof:'#27ae60', win:'#a9dfbf' },
  { body:'#f39c12', roof:'#e67e22', win:'#fad7a0' },
  { body:'#9b59b6', roof:'#8e44ad', win:'#d7bde2' },
  { body:'#1abc9c', roof:'#17a589', win:'#a2d9ce' },
  { body:'#e67e22', roof:'#d35400', win:'#fad7a0' },
  { body:'#ecf0f1', roof:'#bdc3c7', win:'#aed6f1' },
  { body:'#ff6b6b', roof:'#ee5a5a', win:'#ffe0e0' },
  { body:'#a29bfe', roof:'#6c5ce7', win:'#dfe6e9' },
];

// ── Input: keyboard ──
const keys = {};
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (!keys[k]) { keys[k] = true; handleKey(k, e); }
});
document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function handleKey(k, e) {
  if (k === 'enter' || k === ' ') { if (state === 'start' || state === 'dead') startGame(); return; }
  if (k === 'p') { togglePause(); return; }
  if (state !== 'playing') return;
  if ((k === 'a' || k === 'arrowleft')  && player.lane > 0           && !player.moving) { e.preventDefault(); moveLane(-1); }
  if ((k === 'd' || k === 'arrowright') && player.lane < LANES - 1   && !player.moving) { e.preventDefault(); moveLane(1); }
}

// ── Input: touch ──
let touchStartX = null;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  touchStartX = e.touches[0].clientX;
  if (state === 'start' || state === 'dead') { startGame(); return; }
  if (state === 'paused') { togglePause(); return; }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (state !== 'playing' || touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) < 15) {
    // Tap: left half = left, right half = right
    const rect = canvas.getBoundingClientRect();
    const tapX = e.changedTouches[0].clientX - rect.left;
    if (tapX < rect.width / 2) moveLane(-1);
    else moveLane(1);
  } else {
    // Swipe
    if (dx < -20) moveLane(-1);
    else if (dx > 20) moveLane(1);
  }
  touchStartX = null;
}, { passive: false });

function moveLane(dir) {
  if (player.moving) return;
  const next = player.lane + dir;
  if (next < 0 || next >= LANES) return;
  player.lane = next;
  player.moving = true;
}

function togglePause() {
  if (state === 'playing') state = 'paused';
  else if (state === 'paused') { state = 'playing'; loop(); }
}

// ── Game ──
function startGame() {
  score = 0; frame = 0; speed = 4;
  enemies = []; spawnCD = 0;
  player.lane = 1; player.x = laneX(1); player.moving = false;
  roadY = 0;
  state = 'playing';
  cancelAnimationFrame(raf);
  loop();
}

function spawnEnemy() {
  const busy = new Set(enemies.filter(e => e.y < CAR_H * 2.5).map(e => e.lane));
  const free = [0,1,2,3].filter(l => !busy.has(l));
  if (!free.length) return;
  const lane = free[Math.floor(Math.random() * free.length)];
  const col  = PALETTE[Math.floor(Math.random() * PALETTE.length)];
  enemies.push({ lane, x: laneX(lane), y: -CAR_H - 10, color: col,
    speed: speed * (0.55 + Math.random() * 0.5) });
}

function getSpawnInterval() { return Math.max(24, 88 - Math.floor(score / 70)); }

function update() {
  frame++;
  score++;
  speed = 4 + Math.min(11, score / 280);
  roadY = (roadY + speed) % DASH_P;

  // Smooth lateral move
  const tx = laneX(player.lane);
  const dx = tx - player.x;
  if (Math.abs(dx) < 1.5) { player.x = tx; player.moving = false; }
  else player.x += dx * 0.16;

  // Spawn
  if (--spawnCD <= 0) { spawnEnemy(); spawnCD = getSpawnInterval(); }

  // Move enemies
  for (const e of enemies) {
    e.x += (laneX(e.lane) - e.x) * 0.1;
    e.y += speed * 0.85 + e.speed * 0.25;
  }

  // Collision
  for (const e of enemies) {
    if (player.x < e.x + CAR_W - 5 && player.x + CAR_W > e.x + 5 &&
        player.y < e.y + CAR_H - 5 && player.y + CAR_H > e.y + 5) {
      state = 'dead';
      if (score > highScore) { highScore = score; localStorage.setItem('hs_autobahn', highScore); }
      return;
    }
  }

  enemies = enemies.filter(e => e.y < H + 120);

  // UI
  const ds = dispScore(score);
  document.getElementById('ui-score').textContent = ds;
  document.getElementById('ui-high').textContent = Math.max(dispScore(highScore), ds);
  const pct = Math.min(100, ((speed - 4) / 11) * 100);
  document.getElementById('speed-bar').style.width = Math.max(4, pct) + '%';
  const labels = ['Langsam','Flott','Schnell','Rasend','WAHNSINN!'];
  document.getElementById('speed-label').textContent = labels[Math.min(4, Math.floor(pct / 22))];
}

// ── Draw ──
function draw() {
  ctx.fillStyle = '#0d0d12';
  ctx.fillRect(0, 0, W, H);
  drawRoad();
  drawEnemies();
  drawPlayer();
  if (state === 'start')  drawStart();
  if (state === 'paused') drawPause();
  if (state === 'dead')   drawDead();
}

function drawRoad() {
  // Side grass
  ctx.fillStyle = '#0a1a0a';
  ctx.fillRect(0, 0, ROAD_L, H);
  ctx.fillRect(ROAD_R, 0, W - ROAD_R, H);

  // Asphalt
  const ag = ctx.createLinearGradient(ROAD_L, 0, ROAD_R, 0);
  ag.addColorStop(0, '#1c1c28'); ag.addColorStop(.5, '#24242f'); ag.addColorStop(1, '#1c1c28');
  ctx.fillStyle = ag;
  ctx.fillRect(ROAD_L, 0, ROAD_W, H);

  // Yellow borders
  ctx.strokeStyle = '#ffc800'; ctx.lineWidth = 3; ctx.setLineDash([]);
  line(ROAD_L + SHOULDER, 0, ROAD_L + SHOULDER, H);
  line(ROAD_R - SHOULDER, 0, ROAD_R - SHOULDER, H);

  // Lane dashes
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2;
  ctx.setLineDash([DASH_H, DASH_GAP]); ctx.lineDashOffset = -roadY;
  for (let i = 1; i < LANES; i++) {
    const x = ROAD_L + i * LANE_W;
    line(x, 0, x, H);
  }
  ctx.setLineDash([]);
}

function line(x1,y1,x2,y2) { ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }

function drawCar(x, y, col, isPlayer) {
  const w = CAR_W, h = CAR_H;
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(x+w/2, y+h+4, w/2-2, 7, 0, 0, Math.PI*2); ctx.fill();

  // Body
  const bg = ctx.createLinearGradient(x,y,x+w,y);
  bg.addColorStop(0, shade(col.body,-20)); bg.addColorStop(.4,col.body); bg.addColorStop(1,shade(col.body,-30));
  ctx.fillStyle = bg; rr(x+3, y+h*.22, w-6, h*.78, 6); ctx.fill();

  // Roof
  const rg = ctx.createLinearGradient(x,y,x+w,y);
  rg.addColorStop(0,shade(col.roof,-10)); rg.addColorStop(.5,col.roof); rg.addColorStop(1,shade(col.roof,-20));
  ctx.fillStyle = rg; rr(x+8, y+h*.12, w-16, h*.52, 5); ctx.fill();

  // Windows
  ctx.globalAlpha = isPlayer ? 0.88 : 0.72;
  ctx.fillStyle = col.win;
  rr(x+11, y+h*.16, w-22, h*.17, 3); ctx.fill();
  rr(x+11, y+h*.44, w-22, h*.13, 3); ctx.fill();
  ctx.globalAlpha = 1;

  // Lights
  ctx.shadowBlur = 10;
  if (isPlayer) {
    ctx.fillStyle='#ff1100'; ctx.shadowColor='#ff1100';
    ctx.fillRect(x+4,   y+h*.22, 9, 6);
    ctx.fillRect(x+w-13,y+h*.22, 9, 6);
    ctx.fillStyle='#ffffaa'; ctx.shadowColor='#ffffaa';
    ctx.fillRect(x+5,   y+h*.84, 12, 9);
    ctx.fillRect(x+w-17,y+h*.84, 12, 9);
  } else {
    ctx.fillStyle='#ffffaa'; ctx.shadowColor='#ffff88';
    ctx.fillRect(x+5,   y+h*.82, 12, 9);
    ctx.fillRect(x+w-17,y+h*.82, 12, 9);
    ctx.fillStyle='#ff2200'; ctx.shadowColor='#ff2200';
    ctx.fillRect(x+4,   y+5,     9, 6);
    ctx.fillRect(x+w-13,y+5,     9, 6);
  }
  ctx.shadowBlur = 0;

  // Wheels
  ctx.fillStyle='#111';
  ctx.fillRect(x-2, y+h*.24, 8, 13); ctx.fillRect(x+w-6,y+h*.24, 8, 13);
  ctx.fillRect(x-2, y+h*.64, 8, 13); ctx.fillRect(x+w-6,y+h*.64, 8, 13);
  ctx.fillStyle='#333';
  ctx.fillRect(x,   y+h*.25, 4, 9);  ctx.fillRect(x+w-4,y+h*.25, 4, 9);
  ctx.fillRect(x,   y+h*.65, 4, 9);  ctx.fillRect(x+w-4,y+h*.65, 4, 9);

  if (isPlayer) {
    ctx.fillStyle='rgba(255,255,255,0.1)';
    ctx.fillRect(x+w/2-2, y+h*.24, 4, h*.75);
  }
}

function drawPlayer() {
  // Glow under player
  const g = ctx.createRadialGradient(player.x+CAR_W/2, player.y+CAR_H, 5, player.x+CAR_W/2, player.y+CAR_H, 70);
  g.addColorStop(0,'rgba(255,220,0,0.2)'); g.addColorStop(1,'rgba(255,220,0,0)');
  ctx.fillStyle=g; ctx.fillRect(player.x-40,player.y-10,CAR_W+80,CAR_H+70);
  drawCar(player.x, player.y, {body:'#ffc800',roof:'#e6a800',win:'#aef0ff'}, true);
}
function drawEnemies() { enemies.forEach(e => drawCar(e.x, e.y, e.color, false)); }

function overlay(title, rows, hint) {
  ctx.fillStyle='rgba(0,0,10,0.80)'; ctx.fillRect(0,0,W,H);
  const pw=340, ph=rows.length*38+130, px=(W-pw)/2, py=(H-ph)/2;
  ctx.fillStyle='#12121e'; rr(px,py,pw,ph,18); ctx.fill();
  ctx.strokeStyle='#ffc800'; ctx.lineWidth=2; rr(px,py,pw,ph,18); ctx.stroke();

  ctx.textAlign='center'; ctx.font='bold 30px Courier New';
  ctx.fillStyle='#ffc800'; ctx.shadowBlur=18; ctx.shadowColor='#ffc800';
  ctx.fillText(title, W/2, py+52); ctx.shadowBlur=0;

  ctx.font='16px Courier New';
  rows.forEach((r,i) => { ctx.fillStyle=r.c||'#bbb'; ctx.fillText(r.t, W/2, py+94+i*38); });

  if (hint) {
    ctx.font='13px Courier New'; ctx.fillStyle='rgba(255,200,0,0.55)';
    ctx.fillText(hint, W/2, py+ph-18);
  }
  ctx.textAlign='left';
}

function drawStart() {
  overlay('🏎  AUTOBAHN RACER', [
    {t:'Weiche Hindernissen aus!', c:'#aaa'},
    {t:'Komm so weit wie möglich.', c:'#aaa'},
    {t:''},
    {t:`Highscore: ${dispScore(highScore)}`, c:'#00e5ff'},
  ], 'Tippen oder ENTER zum Starten');
}
function drawPause() { overlay('⏸  PAUSE', [{t:'Tippen oder P zum Weiterspielen',c:'#aaa'}], ''); }
function drawDead() {
  const sc=dispScore(score), hs=dispScore(highScore), rec=sc>=hs;
  overlay('CRASH!  💥', [
    {t:`Score: ${sc}`, c:'#ffc800'},
    {t:`Highscore: ${hs}`, c:'#00e5ff'},
    rec ? {t:'★  NEUER REKORD!  ★', c:'#ffc800'} : {t:''},
    {t:''},
  ], 'Tippen oder ENTER zum Nochmal');
}

// ── Loop ──
function loop() {
  if (state==='playing') update();
  draw();
  if (state!=='dead' && state!=='paused') raf = requestAnimationFrame(loop);
  else draw();
}

// ── Utils ──
function rr(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function shade(hex, amt) {
  let [r,g,b]=[1,3,5].map(i=>Math.max(0,Math.min(255,parseInt(hex.slice(i,i+2),16)+amt)));
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}

draw(); // Show start screen immediately
</script>
</body>
</html>
